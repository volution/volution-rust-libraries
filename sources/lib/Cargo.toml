

[package]
name = "vrl"
workspace = "../workspace"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false


[lib]
name = "vrl"
path = "./lib.rs"
test = false
bench = false
doctest = false


[features]
default = []
all = [
	"bytes",
	"cli-arguments",
	"errors",
	"experiments",
	"preludes",
	"random",
]
bytes = ["vrl-bytes"]
cli-arguments = ["vrl-cli-arguments"]
errors = ["vrl-errors"]
experiments = ["vrl-experiments"]
preludes = ["vrl-preludes"]
random = ["vrl-random"]


[dependencies]
vrl-bytes = { workspace = true, optional = true, features = ["all"] }
vrl-cli-arguments = { workspace = true, optional = true, features = ["all"] }
vrl-errors = { workspace = true, optional = true, features = ["all"] }
vrl-experiments = { workspace = true, optional = true, features = ["all"] }
vrl-preludes = { workspace = true, optional = true, features = ["all"] }
vrl-random = { workspace = true, optional = true, features = ["all"] }


