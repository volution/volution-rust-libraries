

[package]
name = "vrl-bytes"
workspace = "../workspace"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false


[lib]
name = "vrl_bytes"
path = "./lib.rs"
test = true
bench = false
doctest = false


[features]
default = []
all = [
	"hex",
	"base32hex",
	"base64url",
	"bech32",
	"z85",
	"mnemonic",
	"proquint",
]
hex = []
base32hex = []
base64url = []
bech32 = []
z85 = []
mnemonic = []
proquint = []


[dependencies]
vrl-preludes = { workspace = true, features = [] }
vrl-errors = { workspace = true, features = [] }
byteorder = { workspace = true, features = [] }


